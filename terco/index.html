<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Como Rezar o Terço — Ave</title>
<meta name="description" content="Os quatro mistérios do terço, dia a dia, com meditações completas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>
<div class="stars"></div>

<nav>
  <a class="brand" href="/">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L13.8 8.6 L20 9.5 L15.2 14 L16.6 20.5 L12 17 L7.4 20.5 L8.8 14 L4 9.5 L10.2 8.6 Z" fill="currentColor" opacity="0.9"/></svg>
    Ave
  </a>
  <div class="nav-links">
    <a href="/">Hoje</a>
    <a href="/terco" class="active">Terço</a>
    <a href="/novenas">Novenas</a>
    <a href="/titulos">Títulos</a>
    <a href="/santos">Santos</a>
  </div>
</nav>

<main class="wrap">
  <p class="eyebrow">Devocional</p>
  <h1 class="page-title">O Santo Terço</h1>
  <p class="page-intro">Cada dia da semana contempla um conjunto de mistérios da vida de Jesus e Maria. Escolha um conjunto abaixo para ler as cinco meditações completas.</p>

  <div id="misterios-lista"></div>
</main>

<footer>Ave — devocional mariano diário</footer>

<script type="module">
  async function carregar() {
    const resp = await fetch('/data/misterios.json');
    const dados = await resp.json();
    const hoje = new Date();
    const chaveHoje = dados.regra_dia_semana[String(hoje.getDay())];

    const container = document.getElementById('misterios-lista');

    for (const [chave, conjunto] of Object.entries(dados.conjuntos)) {
      const secao = document.createElement('section');
      secao.className = 'section';

      const isHoje = chave === chaveHoje;
      secao.innerHTML = `
        <div class="section-head">
          <h2 class="section-title">${conjunto.nome}${isHoje ? ' — hoje' : ''}</h2>
          <span class="section-sub">${conjunto.dias.join(' e ')}</span>
        </div>
        <div class="parchment-card" style="max-width:100%;">
          ${conjunto.misterios.map(m => `
            <div style="text-align:left; margin-bottom:26px;">
              <p style="font-family:'Cinzel',serif; font-weight:500; font-size:1.15rem; color:var(--wine); margin-bottom:4px;">${m.titulo}</p>
              <p style="font-family:'Inter',sans-serif; font-size:.72rem; letter-spacing:.05em; text-transform:uppercase; color:var(--ink-soft); opacity:.7; margin-bottom:8px;">${m.citacao}</p>
              <p style="font-family:'Crimson Pro',serif; font-style:italic; color:var(--ink-soft); line-height:1.7;">${m.contemplacao}</p>
            </div>
          `).join('')}
        </div>
      `;
      container.appendChild(secao);
    }
  }
  carregar().catch(e => console.error('Erro ao carregar mistérios:', e));
</script>

</body>
</html>
