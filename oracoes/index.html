<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<script>
  (function(){
    var t = localStorage.getItem('ave-tamanho-fonte');
    if (t === 'medio' || t === 'grande') document.documentElement.classList.add('fonte-' + t);
  })();
</script>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orações Marianas, Ave</title>
<meta name="description" content="Ave Maria, Salve Rainha, Angelus e Memorare, em texto e áudio.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css?v=5">
</head>
<body>
<div class="stars"></div>

<nav>
  <a class="brand" href="../">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L13.8 8.6 L20 9.5 L15.2 14 L16.6 20.5 L12 17 L7.4 20.5 L8.8 14 L4 9.5 L10.2 8.6 Z" fill="currentColor" opacity="0.9"/></svg>
    Ave
  </a>
  <div class="nav-links">
    <a href="../">Hoje</a>
    <a href="../terco/">Terço</a>
    <a href="../novenas/">Novenas</a>
    <a href="../titulos/">Títulos</a>
    <a href="../santos/">Santos</a>
    <a href="../oracoes/" class="active">Orações</a>
  </div>
  <div class="nav-direita">
    <div id="tamanho-fonte-widget"></div>
    <div id="auth-widget"></div>
  </div>
</nav>

<main class="wrap">
  <p class="eyebrow">Devocional</p>
  <h1 class="page-title">Orações Marianas</h1>
  <p class="page-intro">Texto completo, com opção de ouvir em áudio, gravado por quem mantém este devocional.</p>

  <div id="oracoes-lista"></div>
</main>

<footer>Ave, devocional mariano diário</footer>

<script type="module">
  import { montarPlayer } from '../js/audio-player.js';
  import { montarBotaoFavorito } from '../js/favorito-btn.js';

  async function carregar() {
    const resp = await fetch('../data/oracoes.json');
    const dados = await resp.json();
    const container = document.getElementById('oracoes-lista');

    dados.oracoes.forEach(o => {
      const secao = document.createElement('section');
      secao.className = 'section';
      secao.innerHTML = `
        <div class="section-head">
          <h2 class="section-title">${o.titulo}</h2>
          <div class="fav-slot"></div>
        </div>
        <div class="parchment-card" style="max-width:100%; text-align:left;">
          <p style="font-family:'Crimson Pro',serif; line-height:1.8; color:var(--ink-soft);">${o.texto}</p>
          <div class="audio-slot"></div>
        </div>
      `;
      container.appendChild(secao);
      montarBotaoFavorito(secao.querySelector('.fav-slot'), { tipo: 'oracao', itemId: o.id });
      montarPlayer(secao.querySelector('.audio-slot'), {
        audio_ele: o.audio_ele,
        audio_ela: o.audio_ela
      });
    });
  }
  carregar().catch(e => console.error('Erro ao carregar orações:', e));
</script>

<script type="module">
  import { montarAuthWidget } from '../js/auth-widget.js';
  montarAuthWidget(document.getElementById('auth-widget'));
</script>

<script type="module">
  import { montarTamanhoFonte } from '../js/tamanho-fonte.js';
  montarTamanhoFonte(document.getElementById('tamanho-fonte-widget'));
</script>

</body>
</html>
