<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Crimson+Pro:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

</head>
<body>
<div class="stars"></div>

<nav>
  <a class="brand" href="../">
    <svg viewBox="0 0 24 24" fill="none"><path d="M12 2 L13.8 8.6 L20 9.5 L15.2 14 L16.6 20.5 L12 17 L7.4 20.5 L8.8 14 L4 9.5 L10.2 8.6 Z" fill="currentColor" opacity="0.9"/></svg>

  <div class="nav-links">
    <a href="../">Hoje</a>
    <a href="../terco/">Terço</a>
    <a href="../novenas/">Novenas</a>

    <a href="../santos/">Santos</a>
    <a href="../oracoes/">Orações</a>
  </div>
</nav>

<main class="wrap">
  <p class="eyebrow">Devocional</p>
  <h1 class="page-title">Títulos de Nossa Senhora</h1>
  <p class="page-intro">Ao longo da história, Maria é invocada sob diferentes títulos, ligados a aparições ou a devoções locais. Todos se referem à mesma Mãe de Deus.</p>

  <div id="titulos-lista"></div>
</main>

<footer>Ave — devocional mariano diário</footer>

<script type="module">
  const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];

  async function carregar() {
    const resp = await fetch('../data/titulos-marianos.json');
    const dados = await resp.json();
    const lista = document.getElementById('titulos-lista');

    dados.titulos.forEach(t => {
      const card = document.createElement('div');
      card.className = 'list-card';
      card.innerHTML = `
        <p class="tag">${t.origem} · festa em ${t.festa}</p>
        <h3>${t.nome}</h3>
        <p>${t.resumo}</p>
      `;
      lista.appendChild(card);
    });
  }
  carregar().catch(e => console.error('Erro ao carregar títulos:', e));
</script>

</body>
</html>
